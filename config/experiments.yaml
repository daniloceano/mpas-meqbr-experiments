# Experiment registry for the MeqBr ~5 km MPAS runs.
#
# This file is the *analysis-side mirror* of the authoritative registry kept
# with the simulations themselves:
#     <runs_root>/EXPERIMENTS.md   (what each experiment IS)
#     <runs_root>/README.md        (what they all SHARE)
#     <runs_root>/<EXP>/README.md  (that experiment's delta)
#
# Nothing here is a scientific decision of its own: it restates the run
# metadata in a form scripts can read. If the two ever disagree, the run-side
# documents win — fix this file, not them.
#
# Machine paths live in paths.local.yaml (see paths.example.yaml).

runs_root_note: >
  runs_root is set in paths.local.yaml and points at the directory that holds
  CTL/, EXP01/, EXP02/, EXP01_BADSST/, EXP02_BADSST/ plus the shared mesh
  assets. The _BADSST pair is superseded; see the experiments block.

common_configuration:
  integration_duration_days: 41
  time_step_seconds: 30
  history_interval_hours: 1
  lateral_forcing_interval_hours: 6
  dynamics: "RK3 split-explicit, 3 subpassos dinâmicos e 2 subpassos acústicos"
  horizontal_mixing: "mistura horizontal Smagorinsky 2D"
  physics_suite: "mesoscale_reference"
  physics_components: "microfísica WSM6, radiação RRTMG, camada limite YSU, superfície Monin-Obukhov e convecção Tiedtke"
  land_surface: "Noah-MP"
  limited_area: true
  data_assimilation: false

meshes:
  meqbr_05km:
    n_cells: 76813
    mean_cell_spacing_km: 4.6
    cell_extent: {lat_min: -7.66, lat_max: 6.72, lon_min: -54.95, lon_max: -32.70}
    n_relaxation_cells: 9093
    used_by: [CTL, EXP01, EXP01_BADSST]
  meqbr_05km_buf:
    n_cells: 95138
    mean_cell_spacing_km: 4.6      # in the refined interior; ramps to ~32 km outward
    cell_extent: {lat_min: -12.90, lat_max: 11.86, lon_min: -60.16, lon_max: -27.48}
    n_relaxation_cells: 2188
    used_by: [EXP02, EXP02_BADSST]

vertical:
  # Interfaces from zeta_wind.txt; centers are the midpoints. Over flat terrain
  # (ocean) the centers land exactly on 12.5, 50, 100, 150, 200, 250 m ...
  n_layers: 55
  n_interfaces: 56
  model_top_m: 30000
  # Heights (m AGL) used for model-vs-observation comparison. Each must match a
  # layer center to within `height_tolerance_m`; scripts assert this rather than
  # trusting a hardcoded index.
  comparison_heights_m: [50, 100, 150, 200, 250]
  height_tolerance_m: 1.0

periods:
  # Keys used everywhere in this repo. `history_subdir` is the directory name
  # under <runs_root>/<EXP>/.
  "2021":
    label: "Nov 2021"
    history_subdir: "20211101_20211201"
    analysis_start: "2021-11-01 00:00"
    analysis_end:   "2021-12-01 00:00"
    integration_start: "2021-10-21 00:00"   # spin-up begins; accumulators start here
    spinup_end: "2021-11-01 00:00"
    expected_history_records: 721           # hourly, both endpoints inclusive
    validation_site: P0
  "2022":
    label: "Oct 2022"
    history_subdir: "20221001_20221101"
    analysis_start: "2022-10-01 00:00"
    analysis_end:   "2022-11-01 00:00"
    integration_start: "2022-09-21 00:00"
    spinup_end: "2022-10-01 00:00"
    expected_history_records: 745
    validation_site: LPI

experiments:
  CTL:
    label: "CTL"
    long_label: "CTL — fixed SST, unbuffered mesh"
    parent: null
    delta: "baseline"
    mesh: meqbr_05km
    sst_update: false
    periods: ["2021", "2022"]
    status: complete
    mpi_ranks: 80
    # Wall-clock cost is part of the selection decision (climatological runs are
    # long). CTL ran on 80 ranks, EXP01/EXP02 on 60 — so only relative cell
    # counts are comparable, not raw hours.
    relative_cost: 1.00
    caveats:
      - >
        The two CTL periods were forced by *different* ERA5 download boxes
        (2021: 8/-56/-8/-30, clearing the mesh by only 0.34 deg at the south
        edge; 2022: 12/-60/-12/-28). This is a confounder between CTL's two
        periods and a candidate explanation for a 2021-only boundary artifact.
      - >
        The 2022 leg was run as spin-up + restart; later experiments run it
        straight through. Operational, not scientific.
  EXP01:
    label: "EXP01"
    long_label: "EXP01 — daily SST update"
    parent: CTL
    delta: "config_sst_update = true (NOAA OISST v2.1 daily) instead of SST frozen at the initial ERA5 skin temperature"
    mesh: meqbr_05km
    sst_update: true
    periods: ["2021", "2022"]
    status: complete         # finished 2026-09-09 11:57:47 UTC; overall exit=0
    mpi_ranks: 90
    relative_cost: 1.00
    supersedes: EXP01_BADSST
    # This experiment was first run with a contaminated OISST surface file and
    # was repeated after the converter was fixed. The directory now holding it
    # was called EXP01_CORRECTED while that rerun was in flight, and the shared
    # wrapper log still records it under that name.
    wrapper_aliases: [EXP01_CORRECTED]
    caveats:
      - >
        Ran on 90 MPI ranks against CTL's 80. The MPI decomposition differs, so
        wall-clock cost is not comparable across experiments (use cell counts),
        and bit-level agreement with the superseded run was never expected even
        where the forcing is identical. 90 ranks measurably over-decompose this
        mesh: 3.22 machine-hours per simulated hour against 2.54 on 60.
      - >
        CTL is not "climatological SST": it is the ERA5 skin temperature of the
        initial instant, frozen. The corrected OISST field is ~1.6 K warmer than
        CTL at P0, so EXP01 - CTL still mixes a mean-SST change with the
        introduction of time evolution.
  EXP02:
    label: "EXP02"
    long_label: "EXP02 — buffered mesh + wider ERA5 box"
    parent: EXP01
    delta: "boundary treatment: mesh meqbr_05km_buf (5 -> 32 km ramp) plus ERA5 re-downloaded over a wider box; sst_update stays on"
    mesh: meqbr_05km_buf
    sst_update: true
    periods: ["2021", "2022"]
    status: complete         # 2021 leg 2026-09-26, 2022 leg 2026-10-07; both rc=0
    mpi_ranks: 90
    relative_cost: 1.24      # +23.9 % cells
    supersedes: EXP02_BADSST
    wrapper_aliases: [EXP02_CORRECTED]
    caveats:
      - >
        EXP02 changes mesh AND forcing box together — one inseparable
        intervention, because the buffered mesh cannot be forced by the narrower
        box. Report it as "boundary treatment", not "buffered mesh".
      - >
        EXP02 - EXP01 is the *incremental* effect of the boundary treatment
        given the SST update is already on (the design is cumulative, not
        factorial). It is not the effect of the buffer in isolation.
      - >
        The 2021 leg was restarted once. Its history.2021-10-25_00.00.00.nc sits
        in the preserved directory interrupted_20260909_after_restart/ rather
        than alongside the rest, so the active directory holds 984 of 985 files.
        That timestamp is inside the spin-up, so the 721-record analysis window
        is complete and unaffected. The 2022 leg was also restarted, archived in
        interrupted_20260926_precheckpoint/, and its wrapper died before writing
        a DONE line, so its cost is reconstructed rather than measured.
      - >
        History is written from the integration start (spin-up included) and has
        not been trimmed. Always filter on the analysis window.

  # ---------------------------------------------------------------------------
  # Superseded runs. They are kept registered, and kept in the analysis, because
  # they are the evidence for the OISST coastal land-fill finding: the SST audit,
  # the attribution table and the "size of the artefact" difference map all need
  # them. They must never be quoted as evidence about SST updating or boundary
  # treatment. `sst_forcing_known_bad` tells check_sst_forcing.py that their
  # contamination is expected and documented, so the gate still reports it but
  # does not fail the pipeline on it.
  # ---------------------------------------------------------------------------
  EXP01_BADSST:
    label: "EXP01 (SST ruim)"
    long_label: "EXP01_BADSST — superseded: contaminated coastal OISST"
    parent: CTL
    delta: "same as EXP01, but forced by the uncorrected sfc_update.nc, which carries the OISST land fill value (273.15 K) into 1226 coastal ocean cells"
    mesh: meqbr_05km
    sst_update: true
    periods: ["2021", "2022"]
    status: complete
    mpi_ranks: 60
    relative_cost: 1.00
    superseded_by: EXP01
    sst_forcing_known_bad: true
    caveats:
      - >
        Both LiDAR sites sit inside the contaminated strip (P0: 291.5 K instead
        of ~300 K), so EXP01_BADSST - CTL measures an interpolation error in the
        surface forcing, not the SST-update hypothesis. Superseded by EXP01.
  EXP02_BADSST:
    label: "EXP02 (SST ruim)"
    long_label: "EXP02_BADSST — superseded: contaminated coastal OISST"
    parent: EXP01_BADSST
    delta: "same as EXP02, but inheriting the uncorrected sfc_update.nc (1384 coastal ocean cells at the land fill)"
    mesh: meqbr_05km_buf
    sst_update: true
    periods: ["2021", "2022"]
    status: complete
    mpi_ranks: 60
    relative_cost: 1.24
    superseded_by: EXP02
    sst_forcing_known_bad: true
    caveats:
      - >
        Carries the same contaminated surface forcing as EXP01_BADSST, so its
        site scores are not a test of the boundary treatment. Superseded by
        EXP02. The one comparison it still supports is EXP02_BADSST -
        EXP01_BADSST, where the SST difference is near zero offshore.

boundary_distance_km:
  meqbr_05km:     {P0: 227, LPI: 189}
  meqbr_05km_buf: {P0: 632, LPI: 596}
