# Configuration for monitor_production.py (MEQ-06.8).
# Values follow research/MEQ-06-production-plan.md (DEC-MEQ-006).
# Format: INI (Python configparser). Paths are on Swell.

[ssh]
# Host alias from ~/.ssh/config (Swell, ProxyJump via master).
host = swell

[run]
# Production directory of the EXP03 climatological integration.
# NOTE: the plan does not fix this path yet; reconfirm before MEQ-06.7
# and edit here (or pass --run-dir).
run_dir = /p1-swell/danilocs/MPAS-Research/runs/meqbr_05km_oval_meq02a/meq06_production
# Glob of the MPAS log (the newest match is read).
log_glob = log.atmosphere.0000.out
# Glob of hourly history files; simulated time is read from the file name.
history_glob = history.*.nc
restart_glob = restart.*.nc
# Process name counted as "model running".
process = atmosphere_model

[dates]
spinup_start = 2021-10-21
production_start = 2021-11-01
# Decision points (end of day); the bar runs to the next one not yet reached.
decision_points = 2023-06-30, 2023-11-30, 2025-01-31

[thresholds]
# Warn if the model is running and the log is older than this (minutes).
stale_minutes = 20
# Warn if free space on the output filesystem is below this (TB).
min_free_tb = 1.0
# Throughput window (hours of wall-clock time before the last output).
rate_window_hours = 24
# A foreign process above this %CPU counts as competing for cores.
foreign_cpu_pct = 50
